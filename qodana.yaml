#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"

linter: jetbrains/qodana-cpp:2026.1

profile:
  name: qodana.starter

cpp:
  cmakePreset: arm-none-eabi-gcc-MC_Board-debug

exclude:
  - name: All
    paths:
      - BSP
      - ThirdParty
      - build
      - generated
      - cmake
      - tools
      - OpenOCD
      - logs
      - snapshots
      - .idea

failureConditions:
  severityThresholds:
    critical: 0
    high: 0