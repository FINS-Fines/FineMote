services:
  clang-format:
    image: clang-format:18
    build:
      context: ..
      dockerfile: docker/clang-format/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: >
      bash -lc 'find Algorithms Components Devices Interface Services
      -type f
      \( -name "*.c" -o -name "*.h" -o -name "*.cc" -o -name "*.cpp" -o -name "*.cxx" -o -name "*.hh" -o -name "*.hpp" -o -name "*.hxx" \)
      -print0 | xargs -0 -r clang-format-18 -i'

  check-format:
    image: clang-format:18
    build:
      context: ..
      dockerfile: docker/clang-format/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    volumes:
      - ..:/workspace:ro
    command: >
      bash -lc 'find Algorithms Components Devices Interface Services
      -type f
      \( -name "*.c" -o -name "*.h" -o -name "*.cc" -o -name "*.cpp" -o -name "*.cxx" -o -name "*.hh" -o -name "*.hpp" -o -name "*.hxx" \)
      -print0 | xargs -0 -r clang-format-18 --dry-run --Werror'