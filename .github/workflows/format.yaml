name: Format

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show clang-format version
        run: clang-format-18 --version

      - name: Check format
        run: |
          find Algorithms Components Devices Interface Services \
            -type f \( \
              -name '*.c' -o \
              -name '*.h' -o \
              -name '*.cc' -o \
              -name '*.cpp' -o \
              -name '*.cxx' -o \
              -name '*.hh' -o \
              -name '*.hpp' -o \
              -name '*.hxx' \
            \) \
            -print0 | xargs -0 clang-format-18 --dry-run --Werror